# Production: HTTPS-only cookies, JSON-friendly concise logs, fail fast on missing secrets
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.forward-headers-strategy=framework
spring.datasource.url=${DB_URL}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
logging.level.com.relay=INFO
logging.structured.format.console=ecs
