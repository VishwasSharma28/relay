spring.application.name=relay-backend

# Server
 server.port=${PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=${SHUTDOWN_TIMEOUT:30s}
server.error.include-stacktrace=never
server.error.include-message=never

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5434/relay
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Session-based authentication. Set SESSION_COOKIE_SECURE=true when served over HTTPS.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.timeout=${SESSION_TIMEOUT:8h}

# Actuator: expose health only; health details remain hidden from normal requests.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# Quotas applied to projects without an explicit quota row.
relay.quota.default-daily-requests=${RELAY_DEFAULT_DAILY_REQUESTS:10000}
relay.quota.default-requests-per-minute=${RELAY_DEFAULT_REQUESTS_PER_MINUTE:120}

logging.level.root=INFO
